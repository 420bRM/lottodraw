<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LottoHex 광고 이미지</title>
<style>
:root { --bg: #f6f6f3; --fg: #1d2431; --muted: #5b6474; --card: #fff; --line: #e2e4e8; }
@media (prefers-color-scheme: dark) { :root { --bg: #141a23; --fg: #e8ecf2; --muted: #9aa4b5; --card: #1d2431; --line: #2c3546; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.note { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
figure img { display: block; width: 100%; height: 220px; object-fit: contain; background: #0b0f15; }
figcaption { padding: 10px 12px; font-size: 14px; }
figcaption b { display: block; }
figcaption span { color: var(--muted); }
a { color: inherit; }
</style>
</head>
<body>
<main>
<h1>LottoHex 광고 이미지 (구글 반응형 디스플레이 · 1차)</h1>
<p class="note">2026-11-11 · 사이트 배너 · OG 를 다시 써서 만든 것. 이미지를 누르면 원본이 열립니다(길게 눌러 저장).</p>
<div class="grid">
<figure><a href="landscape-1-map.jpg"><img src="landscape-1-map.jpg" alt="실제 지도 위 육각 칸 + LottoHex 로고"></a><figcaption><b>landscape-1-map.jpg</b><span>가로 1.91:1 · 1200×628 — 실제 지도 위 칸</span></figcaption></figure>
<figure><a href="landscape-2-brand.jpg"><img src="landscape-2-brand.jpg" alt="LottoHex 로또 판매점 땅따먹기"></a><figcaption><b>landscape-2-brand.jpg</b><span>가로 1.91:1 · 1200×628 — 글자가 많아 구글이 경고하면 이것만 뺍니다</span></figcaption></figure>
<figure><a href="square-1-hex.jpg"><img src="square-1-hex.jpg" alt="육각 칸 + LottoHex 로고 + 로또 판매점 땅따먹기"></a><figcaption><b>square-1-hex.jpg</b><span>정사각형 1:1 · 1200×1200 — 육각 칸 그림</span></figcaption></figure>
<figure><a href="square-2-map.jpg"><img src="square-2-map.jpg" alt="실제 지도 위 육각 칸 + 작은 로고"></a><figcaption><b>square-2-map.jpg</b><span>정사각형 1:1 · 600×600 — 실제 지도 위 칸</span></figcaption></figure>
<figure><a href="portrait-hex.jpg"><img src="portrait-hex.jpg" alt="세로 육각 칸 그림 + 로고"></a><figcaption><b>portrait-hex.jpg</b><span>세로 9:16 · 900×1600 — 넣을 칸이 있을 때만</span></figcaption></figure>
<figure><a href="logo-square.png"><img src="logo-square.png" alt="LottoHex 로고(정사각형)"></a><figcaption><b>logo-square.png</b><span>로고 1:1 · 1200×1200</span></figcaption></figure>
<figure><a href="logo-landscape.png"><img src="logo-landscape.png" alt="LottoHex 로고(가로)"></a><figcaption><b>logo-landscape.png</b><span>로고 가로 4:1 · 1200×300</span></figcaption></figure>
</div>
</main>
</body>
</html>

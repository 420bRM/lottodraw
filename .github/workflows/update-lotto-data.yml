name: update-lotto-data

# 추첨은 토요일 20:35 KST. 토요일 밤에는 draw-night 워크플로가 결과가 나오는 대로 이 워크플로를
# 실행한다. 아래 예약은 그게 빠졌을 때의 안전망이다 — 일요일 03:10 KST(토 18:10 UTC)에 받고,
# 1등 금액이 늦게 확정되는 경우를 대비해 월요일 09:10 KST(월 00:10 UTC)에 한 번 더 돈다.
# 스크립트가 최근 3회차를 매번 다시 확인하므로 뒤의 실행은 늦은 값만 고친다.
#
# 주의: schedule 은 저장소 기본 브랜치에 있는 워크플로만 실행된다.
on:
  schedule:
    - cron: "10 18 * * 6"
    - cron: "10 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: html

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 회차 수집
        id: fetch
        run: node tools/update-lotto-data.js

      # 1등 · 2등 판매점(stores-data.json). 동행복권은 추첨 뒤 판매점을 조금 늦게 올리기도 해서 회차가 그대로여도 돌고,
      # 실패해도 로또 갱신은 그대로 간다(continue-on-error). 새 회차 + 최근 3회차만, 요청 사이 0.3초
      - name: 1등 판매점 수집
        id: stores
        continue-on-error: true
        run: node tools/update-stores.js

      # 검색엔진이 읽을 정적 통계 페이지·사이트맵·홈 제목을 새 회차로 다시 쓴다.
      # 블로그(blog/)도 여기서 같이 만든다 — 머리글의 최신 회차가 바뀌고, 원고(content/blog/)를
      # 고치고 생성을 잊었다면 이때 반영된다
      - name: 정적 통계 페이지 생성
        if: steps.fetch.outputs.changed == 'true' || steps.stores.outputs.changed == 'true'
        run: node tools/build-static-stats.js

      - name: 변경분 커밋
        id: commit
        if: steps.fetch.outputs.changed == 'true' || steps.stores.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-data.json prize-data.json stores-data.json index.html about.html tax.html top-prize.html sitemap.xml statistics-*.html draws.html probability.html round/ blog/
          if git diff --cached --quiet; then echo "바뀐 파일 없음"; exit 0; fi
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then
            git commit -m "chore: 로또 ${{ steps.fetch.outputs.latest }}회차까지 반영"
          else
            git commit -m "chore: 1등 판매점 갱신"
          fi
          git push origin HEAD:html
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 푸시한 커밋은 Pages 빌드를 트리거하지 않는다(GitHub 문서).
      # 그래서 빌드를 API로 직접 요청한다.
      - name: Pages 재배포 요청
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      # 바뀐 페이지를 네이버·Bing 에 바로 알린다(IndexNow). 사이트에 반영된 것을 확인한 뒤 보낸다.
      # 수동 실행(Run workflow)이면 바뀐 게 없어도 최신 회차 페이지들을 다시 알린다.
      # 반영은 이미 끝났으므로 여기서 실패해도 워크플로를 실패로 만들지 않는다.
      - name: 네이버·Bing 색인 요청 (IndexNow)
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then
            node tools/indexnow.js $(git diff --name-only HEAD~1 HEAD)
          else
            node tools/indexnow.js --latest
          fi

name: update-lotto-data

# 추첨은 토요일 20:35 KST. 일요일 03:10 KST(토 18:10 UTC)에 받고,
# 1등 금액이 늦게 확정되는 경우를 대비해 월요일 09:10 KST(월 00:10 UTC)에 한 번 더 돈다.
# 스크립트가 최근 3회차를 매번 다시 확인하므로 두 번째 실행은 늦은 값만 고친다.
#
# 주의: schedule 은 저장소 기본 브랜치에 있는 워크플로만 실행된다.
on:
  schedule:
    - cron: "10 18 * * 6"
    - cron: "10 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: html

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 회차 수집
        id: fetch
        run: node tools/update-lotto-data.js

      # 검색엔진이 읽을 정적 통계 페이지·사이트맵·홈 제목을 새 회차로 다시 쓴다
      - name: 정적 통계 페이지 생성
        if: steps.fetch.outputs.changed == 'true'
        run: node tools/build-static-stats.js

      - name: 변경분 커밋
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-data.json index.html tax.html top-prize.html sitemap.xml statistics-*.html draws.html probability.html round/
          git commit -m "chore: 로또 ${{ steps.fetch.outputs.latest }}회차까지 반영"
          git push origin HEAD:html

      # GITHUB_TOKEN 으로 푸시한 커밋은 Pages 빌드를 트리거하지 않는다(GitHub 문서).
      # 그래서 빌드를 API로 직접 요청한다.
      - name: Pages 재배포 요청
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

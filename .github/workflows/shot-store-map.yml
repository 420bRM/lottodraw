name: shot-store-map
# 일회용(머지 전에 지운다): 실제 바탕 지도(OpenFreeMap)로 판매점 지도 화면을 찍어 이 브랜치의 tmp-shots/ 에 올린다
on:
  push:
    branches: [claude/store-map-4]
    paths: [.github/workflows/shot-store-map.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 한글 글꼴
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p tmp-shots
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const log = [];
          for (const [w, h, n] of [[390, 844, 'phone'], [1280, 800, 'pc']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1, locale: 'ko-KR' });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            const p = await ctx.newPage();
            p.on('pageerror', e => log.push(n + ' pageerror ' + e.message));
            p.on('console', m => { if (m.type() === 'error' && !/ERR_FAILED/.test(m.text())) log.push(n + ' console ' + m.text().slice(0, 200)); });
            const shot = k => p.screenshot({ path: `tmp-shots/${n}-${k}.png` });
            await p.goto('http://localhost:8765/store-map.html');
            await p.waitForTimeout(9000);
            await shot('1-seoul');
            await p.fill('#sm-fade', '45'); await p.dispatchEvent('#sm-fade', 'input'); await p.waitForTimeout(1500);
            await shot('2-fade');
            await p.fill('#sm-fade', '0'); await p.dispatchEvent('#sm-fade', 'input'); await p.waitForTimeout(500);
            await p.click('#sm-bars'); await p.waitForTimeout(6000);
            await shot('3-bars');
            await p.mouse.move(w / 2, h / 2);
            await p.mouse.wheel(0, -100); await p.waitForTimeout(120); await shot('4-bars-zoom-a');
            await p.mouse.wheel(0, -100); await p.waitForTimeout(120); await shot('4-bars-zoom-b');
            await p.waitForTimeout(3000); await shot('4-bars-zoom-c');
            await p.click('#sm-bars'); await p.waitForTimeout(500);
            await p.fill('#sm-search', '스파'); await p.waitForTimeout(400);
            await p.locator('#sm-found li button').first().click(); await p.waitForTimeout(7000);
            await shot('5-card');
            await ctx.close();
          }
          console.log(log.join('\n'));
          await b.close();
          JS
          node shot.mjs | tee tmp-shots/log.txt
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-shots && git commit -m "tmp: 판매점 지도 화면 찍기 5 (머지 전에 지운다)" && git pull --rebase origin claude/store-map-4 && git push origin HEAD:claude/store-map-4

name: shot-store-map
# 일회용(머지 전에 지운다): 실제 바탕 지도(OpenFreeMap)로 판매점 지도 화면을 찍어 이 브랜치의 tmp-shots/ 에 올린다
on:
  push:
    branches: [claude/store-map-4]
    paths: [.github/workflows/shot-store-map.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 한글 글꼴
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p tmp-shots
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const log = [];
          for (const [w, h, n] of [[390, 844, 'phone'], [1280, 800, 'pc']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1, locale: 'ko-KR' });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            const p = await ctx.newPage();
            p.on('pageerror', e => log.push(n + ' pageerror ' + e.message));
            p.on('console', m => { if (m.type() === 'error' && !/ERR_FAILED/.test(m.text())) log.push(n + ' console ' + m.text().slice(0, 200)); });
            const shot = k => p.screenshot({ path: `tmp-shots/${n}-${k}.png` });
            for (const [k, hash] of [['lm-yeouido', '15.2/37.5228/126.9250/-12/60'], ['lm-na', '16.6/37.5313/126.9142/-20/58'], ['lm-lotte', '14.9/37.5162/127.1003/-25/60'], ['lm-ntower', '16.2/37.5512/126.9882/15/60'], ['lm-63', '15.9/37.5199/126.9404/-35/60']]) {
              await p.goto('about:blank');
              await p.goto('http://localhost:8765/store-map.html#map=' + hash);
              await p.waitForTimeout(9000);
              await shot(k);
            }
            await ctx.close();
          }
          console.log(log.join('\n'));
          await b.close();
          JS
          node shot.mjs | tee tmp-shots/log.txt
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-shots && git commit -m "tmp: 판매점 지도 화면 찍기 11 (머지 전에 지운다)" && git pull --rebase origin claude/store-map-4 && git push origin HEAD:claude/store-map-4

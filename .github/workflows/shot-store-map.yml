name: shot-store-map
# 일회용(머지 전에 지운다): 실제 바탕 지도(OpenFreeMap)로 판매점 지도 화면을 찍어 이 브랜치의 tmp-shots/ 에 올린다
on:
  push:
    branches: [claude/store-map]
    paths: [.github/workflows/shot-store-map.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p tmp-shots
          cat > /tmp/shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const log = [];
          for (const [w, h, n] of [[390, 844, 'phone'], [1280, 800, 'pc']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1 });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            const p = await ctx.newPage();
            p.on('pageerror', e => log.push(n + ' pageerror ' + e.message));
            p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(n + ' ' + m.type() + ' ' + m.text().slice(0, 200)); });
            await p.goto('http://localhost:8765/store-map.html');
            await p.waitForTimeout(9000);
            await p.screenshot({ path: `tmp-shots/${n}-1-korea.png` });
            await p.fill('#sm-search', '스파'); await p.waitForTimeout(400);
            await p.locator('#sm-found li button').first().click(); await p.waitForTimeout(6000);
            await p.screenshot({ path: `tmp-shots/${n}-2-store.png` });
            await p.click('.sm-close');
            await p.click('#sm-3d'); await p.waitForTimeout(8000);
            await p.screenshot({ path: `tmp-shots/${n}-3-3d.png` });
            await ctx.close();
          }
          console.log(log.join('\n'));
          await b.close();
          JS
          cp /tmp/shot.mjs ./shot.mjs && node shot.mjs | tee tmp-shots/log.txt
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-shots && git commit -m "tmp: 판매점 지도 화면 찍기 (머지 전에 지운다)" && git pull --rebase origin claude/store-map && git push origin HEAD:claude/store-map

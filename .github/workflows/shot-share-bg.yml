# 한 번만 쓰는 찍기 — 판매점 공유 그림 배경(img/share-shop-bg.jpg): TOP 50 밤 지도 · 남한 전체가 오른쪽 절반에. 머지 전에 지운다
name: shot-share-bg
on:
  push:
    branches: [claude/shop-share]
    paths: [.github/workflows/shot-share-bg.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const ctx = await b.newContext({ viewport: { width: 1540, height: 630 }, deviceScaleFactor: 1, locale: 'ko-KR' });
          await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
          const p = await ctx.newPage();
          // 남한 전체(제주 포함)가 1200px 그림의 오른쪽 절반에 오게: 줌 6.05, 가운데를 서쪽으로 280px
          await p.goto('http://localhost:8765/store-map-top50.html#map=6.05/35.85/124.85/0/0');
          await p.addStyleTag({ content: '.sm-side,.sm-near-btn,#theme-btn,.maplibregl-control-container,.sm-star,#chat-fab,#chat-panel,#map-fab,.sm-bl,.sm-info{display:none!important}' });
          await p.waitForTimeout(12000);
          await p.screenshot({ path: 'img/share-shop-bg.jpg', type: 'jpeg', quality: 86, clip: { x: 340, y: 0, width: 1200, height: 630 } });
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/share-shop-bg.jpg && git commit -m "판매점 공유 그림 배경(TOP 50 밤 지도 · 남한 전체)" && git pull --rebase origin claude/shop-share && git push origin HEAD:claude/shop-share

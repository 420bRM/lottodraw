# 블로그 원고(content/blog/)가 html 에 들어오면 그 글과 블로그 목록을 네이버 · Bing 에 바로 알린다(IndexNow, 2026-10-30).
# 매주 자동 갱신(update-lotto-data)의 IndexNow 는 blog/ 를 건너뛴다 — 매주 머리글의 회차만 바뀌기 때문이다.
# 그래서 글을 새로 쓰거나 고쳤을 때만 여기서 알린다. 구글은 IndexNow 를 받지 않는다(sitemap.xml 로 간다).
# 수동 실행(Run workflow)이면 블로그 글 전부를 알린다.
name: blog-indexnow

on:
  push:
    branches: [html]
    paths:
      - "content/blog/**"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 사이트 반영(Pages 배포)을 확인한 뒤 보낸다(tools/indexnow.js 가 15분까지 기다린다). 실패해도 워크플로는 성공으로 둔다
      - name: 네이버·Bing 색인 요청 (블로그)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/indexnow.js --blog
          else
            node tools/indexnow.js --blog $(git diff --name-only HEAD~1 HEAD -- content/blog)
          fi

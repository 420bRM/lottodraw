# 한 번만 쓰는 찍기 — 판매점 공유 그림 배경(img/share-shop-bg.jpg, 낮 지도 · 남한 전체)과
# 시도별 공유 미리보기 그림 17장(img/share/sido-*.jpg, 지도 공유 이미지 og-store-map.jpg 와 같은 짜임). 머지 전에 지운다
# 원이 너무 많지 않게(10-28 사장님): 1등은 5회 이상만, 2등만 나온 곳은 그대로
name: shot-share-sido
on:
  push:
    branches: [claude/share-sido-thin]
    paths: [.github/workflows/shot-share-sido.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fonts
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p img/share
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          // 시도별 판매점이 모인 범위(경도 · 위도 2~98%). 세종은 자료에 다른 지역 좌표가 섞여 손으로 정함
          const BOX = {"강원":[127.3211,37.1715,129.1672,38.2139],"경기":[126.6717,36.9961,127.4877,37.8821],"경남":[127.8549,34.8408,129.1548,35.5666],"경북":[128.1083,35.7245,129.4255,36.9849],"광주":[126.7865,35.1134,126.9338,35.2188],"대구":[128.4476,35.6965,128.7135,35.9427],"대전":[127.3173,36.2981,127.4553,36.4476],"부산":[128.9405,35.0717,129.205,35.2839],"서울":[126.833,37.4686,127.144,37.6627],"세종":[127.2,36.45,127.35,36.65],"울산":[129.1153,35.4141,129.4297,35.6347],"인천":[126.4915,37.3954,126.7453,37.6135],"전남":[126.2692,34.3228,127.7343,35.2997],"전북":[126.6739,35.4002,127.5185,35.9917],"제주":[126.2532,33.2256,126.9145,33.5395],"충남":[126.3229,36.0959,127.4706,36.9384],"충북":[127.3589,36.2795,128.2267,37.1521]};
          const SLUG = {"강원":"gangwon","경기":"gyeonggi","경남":"gyeongnam","경북":"gyeongbuk","광주":"gwangju","대구":"daegu","대전":"daejeon","부산":"busan","서울":"seoul","세종":"sejong","울산":"ulsan","인천":"incheon","전남":"jeonnam","전북":"jeonbuk","제주":"jeju","충남":"chungnam","충북":"chungbuk"};
          const my = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / (2 * Math.PI);
          // 범위가 1200×630 그림의 오른쪽 절반(가로 · 세로 540px 안)에 들게 줌과 가운데를 셈한다
          function view([w, s, e, n]) {
            const zx = Math.log2(540 * 360 / (512 * (e - w))), zy = Math.log2(540 / (512 * (my(n) - my(s))));
            const z = Math.min(12.3, zx, zy);
            const lng = (w + e) / 2 - 300 * 360 / (512 * 2 ** z);
            return '#map=' + z.toFixed(2) + '/' + ((s + n) / 2).toFixed(4) + '/' + lng.toFixed(4) + '/0/0';
          }
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          const HIDE = '.sm-side,.sm-near-btn,#theme-btn,.maplibregl-control-container,.sm-star,#chat-fab,#chat-panel,#map-fab,.sm-bl,.sm-info{display:none!important}';
          const OG = '#og{position:fixed;top:0;bottom:0;left:340px;right:0;z-index:99;font-family:"Noto Sans CJK KR","Noto Sans KR","NanumGothic",sans-serif;' +
            'background:linear-gradient(90deg,#fff 0%,#fff 50%,rgba(255,255,255,.88) 60%,rgba(255,255,255,.35) 72%,rgba(255,255,255,0) 84%)}' +
            '#og .in{position:absolute;left:84px;top:96px}' +
            '#og .brand{margin:0;color:#3a64a8;font-size:31px;font-weight:700;letter-spacing:6.5px}' +
            '#og h1{margin:40px 0 0;color:#003087;font-size:86px;font-weight:900;line-height:1.16;letter-spacing:-1px}' +
            '#og .sub{margin:44px 0 0;color:#1d3b70;font-size:30px;font-weight:500}' +
            '#og .balls{display:flex;gap:18px;margin-top:22px}#og .balls span{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;color:#fff;font-size:30px;font-weight:700}';
          async function shot(hash, out, title) {
            const ctx = await b.newContext({ viewport: { width: 1540, height: 630 }, deviceScaleFactor: 1, locale: 'ko-KR' });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            // 지도 객체를 꺼내 1등 원(st-w1)과 원 안 숫자(st-num)를 1등 5회 이상으로만 거른다
            await ctx.route(/js\/store-map\.js/, async r => { const res = await r.fetch(); r.fulfill({ response: res, body: (await res.text()).replace('map = new maplibregl.Map({', 'map = window.__m = new maplibregl.Map({') }); });
            const p = await ctx.newPage();
            await p.goto('http://localhost:8765/store-map.html' + hash);
            await p.addStyleTag({ content: HIDE + (title ? OG : '') });
            await p.waitForTimeout(9000);
            await p.evaluate(() => { const m = window.__m, five = ['>=', ['get', 'w1'], 5];
              ['st-w1', 'st-num'].forEach(id => { if (m.getLayer(id)) m.setFilter(id, ['all', m.getFilter(id) || true, five]); }); });
            await p.waitForTimeout(2500);
            if (title) await p.evaluate(t => { const d = document.createElement('div'); d.id = 'og';
              const ball = (n, c, dark) => '<span style="background:' + c + (dark ? ';color:#333' : '') + '">' + n + '</span>';
              d.innerHTML = '<div class="in"><p class="brand">LOTTODRAW.KR</p><h1>' + t + '<br>로또 판매점</h1>' +
                '<p class="sub">1등 · 2등 판매점 지도 · 매주 자동 갱신</p>' +
                '<div class="balls">' + ball(7, '#fbc400', 1) + ball(14, '#69c8f2') + ball(25, '#ff7272') + ball(33, '#aaaaaa') + ball(41, '#b0d840', 1) + '</div></div>';
              document.body.appendChild(d); }, title);
            await p.waitForTimeout(600);
            await p.screenshot({ path: out, type: 'jpeg', quality: 86, clip: { x: 340, y: 0, width: 1200, height: 630 } });
            await ctx.close();
          }
          // 판매점 공유 그림(화면이 그 자리에서 그린다)의 배경: 남한 전체가 오른쪽 절반에
          await shot('#map=6.05/35.85/124.85/0/0', 'img/share-shop-bg.jpg', '');
          for (const [s, box] of Object.entries(BOX)) await shot(view(box), 'img/share/sido-' + SLUG[s] + '.jpg', s);
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/share-shop-bg.jpg img/share && git commit -m "공유 그림: 낮 지도 배경 · 시도별 미리보기 17장" && git pull --rebase origin claude/share-sido-thin && git push origin HEAD:claude/share-sido-thin

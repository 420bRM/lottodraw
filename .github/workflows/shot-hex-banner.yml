# 한 번만 쓰는 찍기 — 바닥글 아래 LottoHex 띠 배경(img/hex-banner.jpg · hex-banner-m.jpg). 지도 바탕은 이 환경에서 받지 못해 여기서 찍는다. 머지 전에 지운다
name: shot-hex-banner
on:
  push:
    branches: [claude/hex-banner]
    paths: [.github/workflows/shot-hex-banner.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - name: shot
        timeout-minutes: 10
        run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          BASE=http://localhost:8765 node tools/oneoff/shot-hex-banner.mjs
          ls -la img/hex-banner*
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/hex-banner*.jpg && git commit -m "LottoHex 띠 배경: 실제 밤 지도로 찍기" && git pull --rebase origin claude/hex-banner && git push origin HEAD:claude/hex-banner

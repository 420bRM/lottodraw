# 한 번만 쓰는 찍기 — 바닥글 띠 배경(낮: 지도, 밤: TOP 50 별). 머지 전에 지운다
name: shot-banner
on:
  push:
    branches: [claude/store-map-near]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fonts
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          // PC 왼쪽 칸(340px)을 감추고 그 오른쪽만 자른다
          const SHOTS = [
            [1800, 360, 'img/map-banner.jpg', '12.35/37.548/126.995/0/0', false],
            [900, 480, 'img/map-banner-m.jpg', '11.9/37.545/126.99/0/0', false],
            [1800, 360, 'img/map-banner-night.jpg', '11.2/37.54/127.0/0/0', true],
            [900, 480, 'img/map-banner-night-m.jpg', '10.9/37.54/127.0/0/0', true],
          ];
          for (const [w, h, out, hash, night] of SHOTS) {
            const ctx = await b.newContext({ viewport: { width: w + 340, height: h }, deviceScaleFactor: 1, locale: 'ko-KR' });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            if (night) await ctx.addInitScript(() => { try { localStorage.setItem('lottodraw.theme', 'dark'); } catch (e) {} });
            const p = await ctx.newPage();
            await p.goto('http://localhost:8765/store-map.html#map=' + hash);
            await p.waitForTimeout(3000);
            if (night) await p.click('.sm-chip-top');
            await p.addStyleTag({ content: '.sm-side,.sm-near-btn,.maplibregl-control-container,.sm-star,#chat-fab,#chat-panel,#map-fab,#theme-btn{display:none!important}' });
            await p.waitForTimeout(9000);
            await p.screenshot({ path: out, type: 'jpeg', quality: 80, clip: { x: 340, y: 0, width: w, height: h } });
            await ctx.close();
          }
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/map-banner*.jpg && git commit -m "바닥글 지도 띠 배경 다시 찍기(낮 지도 · 밤 TOP 50 별)" && git pull --rebase origin claude/store-map-near && git push origin HEAD:claude/store-map-near

name: shot-banner
# 일회용(머지 전에 지운다): 바닥글 아래 "판매점 지도" 띠 배경 — 실제 지도(서울 + 버블)를 도구 없이 찍어 img/ 에 올린다
on:
  push:
    branches: [claude/store-map-5]
    paths: [.github/workflows/shot-banner.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 한글 글꼴
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          for (const [w, h, out, hash] of [[1800, 360, 'img/map-banner.jpg', '12.35/37.548/126.995/0/0'], [900, 480, 'img/map-banner-m.jpg', '11.9/37.545/126.99/0/0']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1, locale: 'ko-KR' });
            await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
            const p = await ctx.newPage();
            await p.addStyleTag({ content: '' }).catch(() => {});
            await p.goto('http://localhost:8765/store-map.html#map=' + hash);
            await p.addStyleTag({ content: '.sm-top,.sm-right,.sm-bl,.sm-info,.maplibregl-control-container,.sm-star,#chat-fab,#chat-panel,#map-fab{display:none!important}' });
            await p.waitForTimeout(10000);
            await p.screenshot({ path: out, type: 'jpeg', quality: 78 });
            await ctx.close();
          }
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/map-banner.jpg img/map-banner-m.jpg && git commit -m "판매점 지도 띠 배경(실제 지도 화면)" && git pull --rebase origin claude/store-map-5 && git push origin HEAD:claude/store-map-5

# 한 번만 쓰는 찍기 — TOP 50 지도 공유 이미지(img/og-store-map-top50.jpg). 머지 전에 지운다
name: shot-banner
on:
  push:
    branches: [claude/store-map-og-top]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fonts
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          // TOP 50 지도 공유 이미지(OG 1200×630, 밤 지도 + 별): 기본 공유 이미지(img/og-default.png)와 같은 짜임 — 작은 LOTTODRAW.KR · 두 줄 제목 · 한 줄 소개 · 로또 공 5개.
          // 오른쪽은 실제 지도(서울). PC 왼쪽 칸(340px)을 감추고 그 오른쪽 1200px 만 자른다
          const ctx = await b.newContext({ viewport: { width: 1540, height: 630 }, deviceScaleFactor: 1, locale: 'ko-KR' });
          await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
          const p = await ctx.newPage();
          await p.goto('http://localhost:8765/store-map-top50.html#map=10.3/37.45/126.72/0/0');   // TOP 50 별 · 밤 지도로 열린다
          await p.addStyleTag({ url: 'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block' });   // 기본 공유 이미지와 같은 글꼴
          await p.addStyleTag({ content: '.sm-side,.sm-near-btn,#theme-btn,.maplibregl-control-container,.sm-star,#chat-fab,#chat-panel,#map-fab{display:none!important}' +
            '#og{position:fixed;top:0;bottom:0;left:340px;right:0;z-index:99;font-family:"Noto Sans KR","NanumGothic",sans-serif;' +
            'background:linear-gradient(90deg,#141a23 0%,#141a23 50%,rgba(20,26,35,.88) 60%,rgba(20,26,35,.35) 72%,rgba(20,26,35,0) 84%)}' +
            '#og .in{position:absolute;left:84px;top:96px}' +
            '#og .brand{margin:0;color:#8fa8d6;font-size:31px;font-weight:700;letter-spacing:6.5px}' +
            '#og h1{margin:40px 0 0;color:#ffe9a8;font-size:86px;font-weight:900;line-height:1.16;letter-spacing:-1px}' +
            '#og h1 em{color:#ffc21a;font-style:normal}#og .sub{margin:44px 0 0;color:#c3ccd8;font-size:30px;font-weight:500}' +
            '#og .balls{display:flex;gap:18px;margin-top:22px}#og .balls span{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;color:#fff;font-size:30px;font-weight:700}' });
          await p.waitForTimeout(10000);
          await p.evaluate(() => { const d = document.createElement('div'); d.id = 'og';
            const ball = (n, c, dark) => '<span style="background:' + c + (dark ? ';color:#333' : '') + '">' + n + '</span>';
            d.innerHTML = '<div class="in"><p class="brand">LOTTODRAW.KR</p><h1>로또 판매점<br><em>✦ TOP 50</em></h1>' +
              '<p class="sub">1등이 가장 많이 나온 50곳 · 전국 지도 · 매주 자동 갱신</p>' +
              '<div class="balls">' + ball(7, '#fbc400', 1) + ball(14, '#69c8f2') + ball(25, '#ff7272') + ball(33, '#aaaaaa') + ball(41, '#b0d840', 1) + '</div></div>';
            document.body.appendChild(d); });
          await p.evaluate(async () => { await Promise.all(['500', '700', '900'].map(w => document.fonts.load(w + ' 30px "Noto Sans KR"', '로또 판매점 TOP 50 1등'))); await document.fonts.ready; });
          await p.waitForTimeout(800);
          await p.screenshot({ path: 'img/og-store-map-top50.jpg', type: 'jpeg', quality: 88, clip: { x: 340, y: 0, width: 1200, height: 630 } });
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/og-store-map-top50.jpg && git commit -m "판매점 지도 TOP 50 공유 이미지(OG)" && git pull --rebase origin claude/store-map-og-top && git push origin HEAD:claude/store-map-og-top

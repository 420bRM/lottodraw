# 한 번만 쓰는 찍기 — "밤" · "더 깊은 밤" 견줘 보기용(사장님 확인용). 머지 전에 지운다
name: shot-banner
on:
  push:
    branches: [claude/deep-night]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fonts
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p preview
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
          for (const [w, h, n, hash] of [[390, 844, 'm', '12.2/37.54/126.99/0/0'], [1440, 860, 'pc', '11.8/37.545/127.0/0/0']]) {
            for (const mode of ['night', 'deep']) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: n === 'm' ? 2 : 1, locale: 'ko-KR' });
              await ctx.route(/googlesyndication|cloudflareinsights|api\.lottodraw/, r => r.abort());
              const p = await ctx.newPage();
              await p.goto('http://localhost:8765/store-map.html#map=' + hash);
              await p.waitForTimeout(4000);
              if (mode === 'night') await p.click('#sm-night'); else await p.click('.sm-chip-top');
              await p.waitForTimeout(9000);
              await p.screenshot({ path: `preview/${n}-${mode}.png` });
              await ctx.close();
            }
          }
          await b.close();
          JS
          node shot.mjs
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview && git commit -m "밤 · 더 깊은 밤 견줘 보기(지울 것)" && git pull --rebase origin claude/deep-night && git push origin HEAD:claude/deep-night

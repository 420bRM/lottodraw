name: deploy-worker

# 결제·이용권 서버(worker/)를 Cloudflare Workers 에 올리고, 실서버를 자동 점검한다.
#   배포: html 브랜치에 worker/ 가 바뀌어 들어오면 저절로, 또는 Actions 탭에서 Run workflow.
#   자동 점검: 배포 직후 + 매일 아침 6시 23분(KST). 주문 → 입금 알림 → 키 발급 → 브라우저 확인
#             → 관리자 환불 처리 → 키 정지까지 사람 대신 해 보고 지운다. 실패하면 텔레그램과 GitHub 메일로 알린다.
#
# 저장소 Settings → Secrets and variables → Actions 에 넣을 값 (README 4번 참고)
#   필수: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN, BANK_NAME, BANK_ACCOUNT, BANK_HOLDER
#   선택: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, NOTIFY_URL,
#         PAYAPP_USERID, PAYAPP_LINKKEY, PAYAPP_LINKVAL, PRICES,
#         DEPOSIT_HOOK_SECRET (입금 알림 연결 열쇠. 넣지 않으면 관리자 페이지에서 만든 열쇠를 쓴다),
#         RESEND_API_KEY, MAIL_FROM (키를 구매자 이메일로도 보낸다. MAIL_FROM 예: lottodraw.kr <key@lottodraw.kr>),
#         LICENSE_PRIVATE_JWK (관리자 페이지의 "서명 키 백업" 값. KV 를 잃었을 때만 쓰여 판매한 키가 산다. 잘못 넣어도 발급은 계속된다),
#         GOOGLE_CLIENT_ID (구글 로그인. Google Cloud 의 OAuth 클라이언트 ID, ….apps.googleusercontent.com. 넣으면 로그인·무료 체험·좋아요가 켜진다)
# CLOUDFLARE_API_TOKEN 이 없으면 테스트만 하고 배포는 건너뛴다(실패로 표시하지 않는다).
on:
  push:
    branches: [html]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "23 21 * * *"   # 매일 06:23 KST 자동 점검만

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 테스트
        working-directory: worker
        run: node --test test/*.test.mjs

      - name: Cloudflare 설정 확인
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 없어 배포를 건너뜁니다 (README 4번 설치 순서 참고)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 비어 있지 않은 값만 Worker 비밀값으로 올린다. 여기서 빠진 값은 Worker 에 있던 것이 그대로 남는다.
      - name: 비밀값 모으기
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BANK_NAME: ${{ secrets.BANK_NAME }}
          BANK_ACCOUNT: ${{ secrets.BANK_ACCOUNT }}
          BANK_HOLDER: ${{ secrets.BANK_HOLDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          PAYAPP_USERID: ${{ secrets.PAYAPP_USERID }}
          PAYAPP_LINKKEY: ${{ secrets.PAYAPP_LINKKEY }}
          PAYAPP_LINKVAL: ${{ secrets.PAYAPP_LINKVAL }}
          DEPOSIT_HOOK_SECRET: ${{ secrets.DEPOSIT_HOOK_SECRET }}
          PRICES: ${{ secrets.PRICES }}
          LICENSE_PRIVATE_JWK: ${{ secrets.LICENSE_PRIVATE_JWK }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          node -e '
            const names = ["ADMIN_TOKEN","BANK_NAME","BANK_ACCOUNT","BANK_HOLDER","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID",
              "NOTIFY_URL","PAYAPP_USERID","PAYAPP_LINKKEY","PAYAPP_LINKVAL","DEPOSIT_HOOK_SECRET","PRICES","LICENSE_PRIVATE_JWK","RESEND_API_KEY","MAIL_FROM","GOOGLE_CLIENT_ID"];
            const out = {};
            names.forEach(n => { if (process.env[n]) out[n] = process.env[n]; });
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("올릴 비밀값:", Object.keys(out).join(", ") || "(없음)");
            if (!out.ADMIN_TOKEN || out.ADMIN_TOKEN.length < 16) console.log("::warning::ADMIN_TOKEN 이 없거나 16자보다 짧아 관리자 페이지가 열리지 않습니다");
            if (!(out.BANK_NAME && out.BANK_ACCOUNT && out.BANK_HOLDER)) console.log("::warning::BANK_NAME/BANK_ACCOUNT/BANK_HOLDER 가 모두 있어야 계좌이체 주문이 열립니다");
          '

      - name: 배포
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: 비밀값 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      # 새 도메인은 인증서가 붙는 데 몇 분 걸릴 수 있어 실패해도 넘어간다
      - name: 동작 확인
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.lottodraw.kr/api/config; then echo; exit 0; fi
            sleep 20
          done
          echo "::warning::https://api.lottodraw.kr 에 아직 연결되지 않습니다. 몇 분 뒤 다시 확인하거나, Cloudflare 대시보드에서 Worker 의 Custom Domain 을 확인하세요."

  smoke:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 실서버 자동 점검 (주문 → 입금 → 열림 → 환불 → 잠김)
        id: smoke
        env:
          API_BASE: https://api.lottodraw.kr
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::아직 배포 설정 전이라 자동 점검을 건너뜁니다"
            exit 0
          fi
          # 새 배포 직후에는 도메인이 붙는 데 잠깐 걸릴 수 있다
          for i in $(seq 1 12); do curl -fsS "$API_BASE/api/config" > /dev/null && break; sleep 10; done
          node worker/test/live-smoke.mjs

      - name: 점검 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              --data-urlencode text="lottodraw 결제 서버 자동 점검 실패. 기록: $RUN_URL" > /dev/null || true
          fi

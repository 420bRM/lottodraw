# 일회용(2026-11-11 사장님 — "최근 공지 하나 같이 띄우자"): LottoHex 소식 띠 공지 올리기. 이 가지는 html 로 합치지 않고 지운다
name: post-hex-notice-once
on:
  push:
    branches: [claude/hex-notice-once]
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 소식 띠 공지 올리기(7일)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          cat > body.json <<'JSON'
          {"text":"LottoHex 정식 시작(2026.11.9) · GPS 위치 인증이 켜졌습니다. 판매점 50m 안에서 인증하고 칸을 차지하세요!","hours":168}
          JSON
          code=$(curl -s -o out.json -w '%{http_code}' -X POST https://api.lottodraw.kr/api/admin/hex-notice \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data @body.json)
          echo "HTTP $code"
          python3 -c "import json; d=json.load(open('out.json')); n=d.get('notice') or {}; print('notice:', n.get('text')); print('until(ms):', n.get('until'))"
          test "$code" = 200
      - name: 공개 소식 확인
        run: |
          sleep 2
          curl -s https://api.lottodraw.kr/api/territory/feed | python3 -c "import sys,json; d=json.load(sys.stdin); print('feed notice:', (d.get('notice') or {}).get('text')); print('feed items:', len(d.get('feed') or []))"

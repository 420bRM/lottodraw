# 한 번만 쓰는 찍기 — 블로그 "LottoHex 하는 법"의 화면 예시 3장(img/blog/lottohex-*.jpg).
# 지도 바탕(OpenFreeMap)은 이 환경에서 받지 못해 여기서 찍는다. 머지 전에 지운다
name: shot-lottohex
on:
  push:
    branches: [claude/lottohex-blog]
    paths: [.github/workflows/shot-lottohex.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fonts
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-nanum >/dev/null
      - run: npm i --no-save playwright@1.56.1 && npx playwright install chromium
      - name: shot
        timeout-minutes: 10
        run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          BASE=http://localhost:8765 node tools/oneoff/shot-lottohex.mjs
          ls -la img/blog
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/blog/lottohex-*.jpg && git commit -m "블로그 LottoHex 화면 예시: 실제 지도로 다시 찍기" && git pull --rebase origin claude/lottohex-blog && git push origin HEAD:claude/lottohex-blog

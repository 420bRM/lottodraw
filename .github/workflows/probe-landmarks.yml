name: probe-landmarks
# 일회용(머지 전에 지운다): OSM 랜드마크 외곽선 받기
on:
  push:
    branches: [claude/store-map-4]
    paths: [.github/workflows/probe-landmarks.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tools/probe-landmarks.js | tee tmp-shots-log.txt; mkdir -p tmp-shots; mv tmp-shots-log.txt tmp-shots/osm-log-parc.txt
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-shots && git commit -m "tmp: 랜드마크 OSM 자료 2 (머지 전에 지운다)" && git pull --rebase origin claude/store-map-4 && git push origin HEAD:claude/store-map-4

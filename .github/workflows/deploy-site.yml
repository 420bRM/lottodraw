# 사이트(정적 파일)를 Cloudflare Workers 로 올린다(2026-11-16 — GitHub Pages 에서 옮기는 준비).
#
# 지금은 손으로만 돈다(Actions → deploy-site → Run workflow). 이름이 lottodraw-site 인 Worker 의 workers.dev 시험 주소에 올리고
# tools/check-site.js 로 사이트맵 전체 · 폴더 주소 · 404 · 내부 파일 차단을 본다. www.lottodraw.kr 은 아직 GitHub Pages 그대로다.
# www 를 이 Worker 로 옮긴 뒤에는 push 와 자동 갱신 작업 끝에서도 돌게 바꾼다(또는 Cloudflare Workers Builds 로 넘긴다).
#
# 비밀값: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID (deploy-worker 와 같은 것)
name: deploy-site

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 사이트로 내보낼 파일만 dist/ 에
        run: node tools/build-dist.js

      - name: 배포 (workers.dev 시험 주소)
        working-directory: site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://lottodraw-site\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then echo "::error::배포 기록에서 workers.dev 주소를 못 찾았다"; exit 1; fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "### 시험 주소: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: 시험 주소가 열릴 때까지 (처음 배포는 1분쯤 걸린다)
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/index.html" || true)
            if [ "$code" = "200" ]; then echo "열림 (${i}번째)"; exit 0; fi
            sleep 5
          done
          echo "::error::$SITE_URL/index.html 이 2분 동안 200 이 아니다 (마지막 $code)"; exit 1

      - name: 점검 (사이트맵 전체 · 폴더 주소 · 404 · 내부 파일 차단 · 캐시)
        run: node tools/check-site.js "$SITE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

# lottodraw.kr 결제·이용권 서버. 배포는 .github/workflows/deploy-worker.yml 이 한다.
# 비밀값(계좌, 관리자 토큰 등)은 여기 적지 않는다 — 이 파일은 공개 저장소에 있다.
name = "lottodraw-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# api.lottodraw.kr 로 연결. lottodraw.kr 도메인이 같은 Cloudflare 계정에 있어야 한다.
routes = [
  { pattern = "api.lottodraw.kr", custom_domain = true },
]

[vars]
SITE_URL = "https://www.lottodraw.kr"
ALLOWED_ORIGINS = "https://www.lottodraw.kr,https://lottodraw.kr"

# 주문·서명 키·환불 목록 저장소. id 를 비워 두면 첫 배포 때 wrangler 가 알아서 만든다.
[[kv_namespaces]]
binding = "DB"

# 같은 IP 에서 1분에 주문 5건까지 (도배 방지)
[[ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# 구글 로그인: 같은 IP 에서 1분에 10번까지
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# 실시간 채팅 연결: 같은 IP 에서 1분에 30번까지. PC 는 채팅을 펼친 채로 시작해 페이지를 옮길 때마다 다시 붙는다
# (예전에는 로그인과 같은 1분 10번을 나눠 써서, 빨리 둘러보거나 한 IP 를 여럿이 쓰면 막혔다)
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 30
  period = 60

# 좋아요: 한 로그인에서 1분에 30번까지
[[ratelimits]]
name = "REACT_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# 공유 · 출력 집계(/api/tap): 같은 IP 에서 1분에 30번까지. 횟수 부풀리기와 회원 저장소 쓰기 한도 소모를 막는다
[[ratelimits]]
name = "TAP_LIMIT"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 30
  period = 60

# 블로그 조회수(/api/view): 같은 IP 에서 1분에 60번까지. 같은 글은 브라우저가 하루 한 번만 보내니 사람은 닿지 않는다.
# 통신사 공용 IP(여럿이 한 IP)를 생각해 공유 집계보다 넉넉히 둔다
[[ratelimits]]
name = "VIEW_LIMIT"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 60
  period = 60

# 회원·로그인 세션·좋아요·공유 집계·블로그 조회수 저장소 (src/community.js). 결제용 KV 와 나눠 KV 쓰기 한도를 결제에 남긴다.
# 무료 요금제는 SQLite 저장 방식만 쓸 수 있다.
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Community"]

# 실시간 채팅방 (src/chat.js). 메시지는 24시간 뒤 사라진다.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatRoom"]

[observability]
enabled = true

# 한 시간마다 지킴이: 입금 알림 연결(휴대폰)이 끊기면 판매자에게 알린다
[triggers]
crons = ["17 * * * *"]

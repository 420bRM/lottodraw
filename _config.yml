# GitHub Pages(Jekyll) 설정. 사이트는 정적 HTML 이라 Jekyll 이 할 일은 거의 없다.
#
# 블로그 원고(content/blog/*.md)는 머리말(---)이 있어서 그대로 두면 Jekyll 이
# /content/blog/…html 이라는 별도 페이지로 바꿔 올린다 — 같은 글이 주소 두 곳에
# 생긴다. 블로그 페이지는 tools/build-blog.js 가 blog/ 에 만들어 두므로 원고는 뺀다.
#
# exclude 를 적으면 GitHub Pages 의 기본값(CNAME 제외)을 덮어쓰므로 CNAME 도 같이 적는다.
# README · 생성기(tools) · 결제 서버(worker) · 미리보기 그림(preview)은 사이트에 필요 없다(2026-10-19 결정, 11-01 반영).
# 페이지가 읽는 자료(*.json · js · css · img · round · blog)는 빼지 않는다. 점으로 시작하는 .github 는 원래 빠진다.
exclude:
  - CNAME
  - content
  - README.md
  - tools
  - worker
  - preview
